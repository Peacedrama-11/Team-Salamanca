openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workforce
    description: Workforce data integrations
paths:
  /workforce/cv/skills:
    get:
      operationId: getCvSkills
      tags: [workforce]
      summary: Technical skill dictionary and aliases
      responses:
        "200":
          description: Supported canonical skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CvSkillDefinition"
  /workforce/cv/extract:
    post:
      operationId: extractCv
      tags: [workforce]
      summary: Transiently parse an up-to-8-MB PDF or DOCX; never retain the document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CvUpload"
      responses:
        "200":
          description: Unconfirmed extracted profile without raw CV text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvExtraction"
        "400":
          description: Unsupported, unreadable or malformed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Upload exceeds resource limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Parser busy; retry shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workforce/cv/matches:
    post:
      operationId: matchCv
      tags: [workforce]
      summary: Compare confirmed skills with cached requirements without fetching jobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvProfile"
      responses:
        "200":
          description: Up to ten ranked results and separate unknowns and experience exclusions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvMatchResult"
        "400":
          description: Invalid profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workforce/labour-market:
    get:
      operationId: getMalaysiaLabourMarket
      tags: [workforce]
      summary: Get Malaysia's official monthly labour-force statistics
      description: Returns the 12 latest observations from the official lfs_month dataset. Successful responses are cached by the server.
      responses:
        "200":
          description: Official monthly labour-force statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabourMarketData"
        "502":
          description: The official source could not be reached or its response was invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workforce/jobs/provider-status:
    get:
      operationId: getJobsStatus
      tags: [workforce]
      summary: Public job-board collection health and coverage
      responses:
        "200":
          description: Jobs integration readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsStatus"
  /workforce/jobs/search:
    post:
      operationId: searchJobs
      tags: [workforce]
      summary: Search cached real vacancies; starts a background refresh when needed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobSearchInput"
      responses:
        "200":
          description: Paginated jobs and collection status, including pending or failed collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSearchResult"
        "400":
          description: Invalid filters or email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workforce/jobs/matches:
    post:
      operationId: matchJobs
      tags: [workforce]
      summary: Rank real vacancies using entered profile and actual posting metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobMatchInput"
      responses:
        "200":
          description: Explainable metadata-based relevance, not a hiring probability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMatchResult"
        "400":
          description: Invalid profile or email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workforce/jobs/refresh:
    post:
      operationId: refreshJobs
      tags: [workforce]
      summary: Request deduplicated rate-limited background collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobRefreshInput"
      responses:
        "202":
          description: Collection accepted or already running/cooling down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsStatus"
        "400":
          description: Invalid contact email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CvUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    CvSkillDefinition:
      type: object
      required: [name, aliases]
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
    CvSkill:
      type: object
      required: [name, level]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        level:
          type: string
          enum: [unspecified, beginner, intermediate, advanced]
    CvProfile:
      type: object
      required: [skills, experienceYears]
      properties:
        skills:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/CvSkill"
        experienceYears:
          type: ["number", "null"]
          minimum: 0
          maximum: 80
    CvExtraction:
      type: object
      required: [skills, experienceYears, warnings]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/CvSkill"
        experienceYears:
          type: ["number", "null"]
        warnings:
          type: array
          items:
            type: string
    CvMatch:
      type: object
      required: [job, score, matchedSkills, missingSkills, requiredSkills, experienceRequired, eligibility, evidence]
      properties:
        job:
          $ref: "#/components/schemas/JobPosting"
        score:
          type: ["number", "null"]
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        requiredSkills:
          type: array
          items:
            type: string
        experienceRequired:
          type: ["number", "null"]
        eligibility:
          type: string
          enum: [meets, below-stated, above-current, unknown]
        evidence:
          type: array
          items:
            type: string
    CvMatchResult:
      type: object
      required: [matches, unscored, excluded, totalRanked, totalUnscored, totalExcluded, method, status, profile]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/CvMatch"
        unscored:
          type: array
          items:
            $ref: "#/components/schemas/CvMatch"
        excluded:
          type: array
          items:
            $ref: "#/components/schemas/CvMatch"
        totalRanked:
          type: integer
        totalUnscored:
          type: integer
        totalExcluded:
          type: integer
        method:
          type: string
        status:
          $ref: "#/components/schemas/JobsStatus"
        profile:
          $ref: "#/components/schemas/CvProfile"
    JobRefreshInput:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    LabourMarketObservation:
      type: object
      properties:
        date:
          type: string
          description: Observation month in YYYY-MM-DD format.
        labourForce:
          type: number
          description: People in the labour force, thousands.
        employed:
          type: number
          description: Employed people, thousands.
        unemployed:
          type: number
          description: Unemployed people, thousands.
        outsideLabourForce:
          type: number
          description: People outside the labour force, thousands.
        participationRate:
          type: number
          description: Labour-force participation rate, percent.
        employmentPopulationRatio:
          type: number
          description: Employment-to-population ratio, percent.
        unemploymentRate:
          type: number
          description: Unemployment rate, percent.
      required:
        - date
        - labourForce
        - employed
        - unemployed
        - outsideLabourForce
        - participationRate
        - employmentPopulationRatio
        - unemploymentRate
    LabourMarketData:
      type: object
      properties:
        datasetId:
          type: string
          enum: [lfs_month]
        dataType:
          type: string
          enum: [official-labour-market-statistics]
        country:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        catalogueUrl:
          type: string
        reportingPeriod:
          type: ["string", "null"]
          description: Latest observation month in YYYY-MM format, or null when the dataset has no observations.
        retrievedAt:
          type: string
          description: ISO 8601 timestamp recorded when the upstream data was retrieved.
        units:
          type: string
        observations:
          type: array
          items:
            $ref: "#/components/schemas/LabourMarketObservation"
      required:
        - datasetId
        - dataType
        - country
        - sourceName
        - sourceUrl
        - catalogueUrl
        - reportingPeriod
        - retrievedAt
        - units
        - observations
    JobSearchInput:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        query:
          type: string
          maxLength: 150
        location:
          type: string
          maxLength: 100
        region:
          type: string
          enum: [all, apac, anz, remote]
        remote:
          type: boolean
        employmentType:
          type: string
          maxLength: 100
        page:
          type: integer
          minimum: 1
          maximum: 100000
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
    JobMatchInput:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
        skills:
          type: array
          maxItems: 40
          items:
            type: string
            maxLength: 100
        field:
          type: string
          maxLength: 200
        goal:
          type: string
          maxLength: 300
        location:
          type: string
          maxLength: 100
        page:
          type: integer
          minimum: 1
          maximum: 100000
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
      required: [skills]
    JobPosting:
      type: object
      required: [id, provider, company, title, location, employmentType, department, team, isRemote, workplaceType, postedAt, url, fetchedAt]
      properties:
        description:
          type: ["string", "null"]
          maxLength: 30000
        id:
          type: string
        provider:
          type: string
          enum: [ashby, greenhouse, lever]
        company:
          type: string
        title:
          type: string
        location:
          type: ["string", "null"]
        employmentType:
          type: ["string", "null"]
        department:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
        isRemote:
          type: ["boolean", "null"]
        workplaceType:
          type: ["string", "null"]
        postedAt:
          type: ["string", "null"]
        url:
          type: string
        fetchedAt:
          type: string
    BoardHealth:
      type: object
      required: [provider, company, state, fetchedAt, count]
      properties:
        provider:
          type: string
        company:
          type: string
        state:
          type: string
          enum: [pending, ok, failed]
        fetchedAt:
          type: ["string", "null"]
        count:
          type: integer
    JobsStatus:
      type: object
      required: [state, refreshing, fetchedAt, stale, totalJobs, boards, coverage, retryAfterSeconds]
      properties:
        state:
          type: string
          enum: [pending, ready, partial, unavailable]
        refreshing:
          type: boolean
        fetchedAt:
          type: ["string", "null"]
        stale:
          type: boolean
        totalJobs:
          type: integer
        boards:
          type: array
          items:
            $ref: "#/components/schemas/BoardHealth"
        coverage:
          type: string
        retryAfterSeconds:
          type: integer
    JobSearchResult:
      type: object
      required: [jobs, total, page, pageSize, employmentTypes, status]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobPosting"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        employmentTypes:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/JobsStatus"
    JobMatch:
      type: object
      required: [job, score, evidence, missingInformation, unmatchedSkills]
      properties:
        job:
          $ref: "#/components/schemas/JobPosting"
        score:
          type: integer
        evidence:
          type: array
          items:
            type: string
        missingInformation:
          type: array
          items:
            type: string
        unmatchedSkills:
          type: array
          items:
            type: string
    JobMatchResult:
      type: object
      required: [matches, total, page, pageSize, method, status]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/JobMatch"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        method:
          type: string
        status:
          $ref: "#/components/schemas/JobsStatus"
