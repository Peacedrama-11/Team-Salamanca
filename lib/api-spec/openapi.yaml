openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workforce
    description: Workforce data integrations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workforce/labour-market:
    get:
      operationId: getMalaysiaLabourMarket
      tags: [workforce]
      summary: Get Malaysia's official monthly labour-force statistics
      description: Returns the 12 latest observations from the official lfs_month dataset. Successful responses are cached by the server.
      responses:
        "200":
          description: Official monthly labour-force statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabourMarketData"
        "502":
          description: The official source could not be reached or its response was invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /workforce/jobs/provider-status:
    get:
      operationId: getHeadcountLabsProviderStatus
      tags: [workforce]
      summary: Get the Headcount Labs jobs integration status
      description: Reports whether the expected secret exists and whether the provider contract is integrated. Does not make an authenticated request.
      responses:
        "200":
          description: Jobs integration readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobProviderStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    LabourMarketObservation:
      type: object
      properties:
        date:
          type: string
          description: Observation month in YYYY-MM-DD format.
        labourForce:
          type: number
          description: People in the labour force, thousands.
        employed:
          type: number
          description: Employed people, thousands.
        unemployed:
          type: number
          description: Unemployed people, thousands.
        outsideLabourForce:
          type: number
          description: People outside the labour force, thousands.
        participationRate:
          type: number
          description: Labour-force participation rate, percent.
        employmentPopulationRatio:
          type: number
          description: Employment-to-population ratio, percent.
        unemploymentRate:
          type: number
          description: Unemployment rate, percent.
      required:
        - date
        - labourForce
        - employed
        - unemployed
        - outsideLabourForce
        - participationRate
        - employmentPopulationRatio
        - unemploymentRate
    LabourMarketData:
      type: object
      properties:
        datasetId:
          type: string
          enum: [lfs_month]
        dataType:
          type: string
          enum: [official-labour-market-statistics]
        country:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        catalogueUrl:
          type: string
        reportingPeriod:
          type: ["string", "null"]
          description: Latest observation month in YYYY-MM format, or null when the dataset has no observations.
        retrievedAt:
          type: string
          description: ISO 8601 timestamp recorded when the upstream data was retrieved.
        units:
          type: string
        observations:
          type: array
          items:
            $ref: "#/components/schemas/LabourMarketObservation"
      required:
        - datasetId
        - dataType
        - country
        - sourceName
        - sourceUrl
        - catalogueUrl
        - reportingPeriod
        - retrievedAt
        - units
        - observations
    JobProviderStatus:
      type: object
      properties:
        credentialsConfigured:
          type: boolean
        integrationStatus:
          type: string
          enum: [credentials_required, provider_contract_pending]
      required:
        - credentialsConfigured
        - integrationStatus

